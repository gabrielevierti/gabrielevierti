<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="ER Studio: A VS Code extension for G2 apps: simulator, doctor and SDK reference beside your code."><title>ER Studio: A VS Code extension for G2 apps: simulator, doctor and SDK reference beside your code.</title><style>
