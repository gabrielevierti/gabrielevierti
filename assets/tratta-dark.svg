@keyframes tl6{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes sc6{from{transform:translateX(0)}to{transform:translateX(150px)}}</style><rect x=".5" y=".5" width="479" height="219" rx="12" fill="#161b22" stroke="#30363d"/><text x="28" y="44" class="sans" font-size="11" font-weight="600" letter-spacing="1.2" fill="#8b949e">TRAVEL · OFFLINE WEB APP</text><text x="27" y="80" class="sans" font-size="27" font-weight="700" letter-spacing="-.5" fill="#e6edf3">Tratta</text><text x="28" y="109" class="sans" font-size="14.5" fill="#8b949e">A journey planner with a</text><text x="28" y="129" class="sans" font-size="14.5" fill="#8b949e">scrubbable timeline, a live map</text><text x="28" y="149" class="sans" font-size="14.5" fill="#8b949e">and an auditable cost ledger.</text><text x="28" y="196" class="sans" font-size="12.5" font-weight="600" fill="#58a6ff">gabrielevierti/tratta →</text><g transform="translate(386 108) scale(1)"><rect x="-84" y="-60" width="168" height="108" rx="8" class="dimline" opacity=".6"/><path d="M-84-20h168M-84 14h168M-40-60v108M10-60v108M56-60v108" class="dimline" opacity=".25"/><path id="rt" d="M-74 30C-50 28-46-6-20-10S10 22 30 10 56-40 76-42" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/><circle cx="-74" cy="30" r="3.2" fill="#161b22" stroke="#e6edf3" stroke-width="1.3"/><circle cx="-20" cy="-10" r="3.2" fill="#161b22" stroke="#e6edf3" stroke-width="1.3"/><circle cx="30" cy="10" r="3.2" fill="#161b22" stroke="#e6edf3" stroke-width="1.3"/><circle cx="76" cy="-42" r="3.2" fill="#161b22" stroke="#e6edf3" stroke-width="1.3"/><circle r="5" fill="#d29922" stroke="#161b22" stroke-width="1.5"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion></circle><path d="M-74 66H76" stroke="#30363d" stroke-width="4" stroke-linecap="round"/><path d="M-74 66H76" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" style="transform-origin:-74px 0;animation:tl6 6s linear infinite"/><circle cx="-74" cy