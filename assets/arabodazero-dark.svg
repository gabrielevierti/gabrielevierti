<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Arabo da Zero: Free, open Arabic course for Italian speakers, from the alphabet to level C1."><title>Arabo da Zero: Free, open Arabic course for Italian speakers, from the alphabet to level C1.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#58a6ff;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#484f58;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes letter{0%{opacity:0;transform:translateY(6px)}5%,20%{opacity:1;transform:none}25%,100%{opacity:0}}@keyframes fill{0%{transform:scaleX(.04)}90%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){text[direction]:first-of-type{opacity:1!important}}</style><rect x=".5" y=".5" width="479" height="219" rx="12" fill="#161b22" stroke="#30363d"/><text x="28" y="44" class="sans" font-size="11" font-weight="600" letter-spacing="1.2" fill="#8b949e">EDUCATION · TYPESCRIPT</text><text x="27" y="80" class="sans" font-size="27" font-weight="700" letter-spacing="-.5" fill="#e6edf3">Arabo da Zero</text><text x="28" y="109" class="sans" font-size="14.5" fill="#8b949e">Free, open Arabic course for</text><text x="28" y="129" class="sans" font-size="14.5" fill="#8b949e">Italian speakers, from the</text><text x="28" y="149" class="sans" font-size="14.5" fill="#8b949e">alphabet to level C1.</text><text x="28" y="196" class="sans" font-size="12.5" font-weight="600" fill="#58a6ff">arabodazero.it →</text><g transform="translate(386 108)"><path d="M-56 30H56" class="dimline" opacity=".6"/><text x="0" y="22" text-anchor="middle" font-size="84" fill="#58a6ff" class="sans" direction="rtl" style="opacity:0;animation:letter 8s ease-in-out -0.6s infinite">ع</text><text x="0" y="22" text-anchor="middle" font-size="84" fill="#58a6ff" class="sans" direction="rtl" style="opacity:0;animation:letter 8s ease-in-out 1.4s infinite">ر</text><text x="0" y="22" text-anchor="middle" font-size="84" fill="#58a6ff" class="sans" direction="rtl" style="opacity:0;animation:letter 8s ease-in-out 3.4s infinite">ب</text><text x="0" y="22" text-anchor="middle" font-size="84" fill="#58a6ff" class="sans" direction="rtl" style="opacity:0;animation:letter 8s ease-in-out 5.4s infinite">ي</text><text x="-56" y="56" class="sans" font-size="10" fill="#8b949e">A0</text><text x="56" y="56" text-anchor="end" class="sans" font-size="10" fill="#8b949e">C1</text><rect x="-38" y="49" width="76" height="6" rx="3"