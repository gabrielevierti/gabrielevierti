<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="OpenG1 SDK: Open SDK and visual simulator for G1 smart glasses. Same API on real hardware and on your desk."><title>OpenG1 SDK: Open SDK and visual simulator for G1 smart glasses. Same API on real hardware and on your desk.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
